name: Sync database

# Pushes the reviewed portfolio index into Supabase. Runs whenever the
# generated artifact changes on main (i.e. after a data-sync PR is merged)
# and on manual dispatch. Idempotent: re-running converges to the artifact.
#
# Required repository secrets:
#   SUPABASE_URL               https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  service-role (secret) key — server-side only

on:
  push:
    branches: [main, master]
    paths:
      - src/data/portfolios.generated.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-database
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync Supabase from artifact + verified upstream history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun scripts/seed-db.ts --clone-dir "$RUNNER_TEMP/upstream"
