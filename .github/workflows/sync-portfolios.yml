name: Sync portfolios

# Fully automatic daily sync from the upstream repository:
#   fetch + validate → (only if the portfolio list changed) unit tests →
#   update Supabase → commit the refreshed artifact to main (Vercel redeploys).
# A failed fetch, a failed test or a failed database write stops the run
# before anything is published, so good data is never overwritten.
#
# Required repository secrets:
#   SUPABASE_URL         https://<project-ref>.supabase.co
#   SUPABASE_SECRET_KEY  secret (service-role) key — server-side only

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch and validate the upstream list
        run: bun scripts/sync-portfolios.ts

      - name: Detect real changes
        id: diff
        # The artifact always gets a fresh timestamp; compare the portfolio
        # list and upstream commit instead, and discard timestamp-only changes.
        run: |
          changed=$(bun -e '
            const { execSync } = require("node:child_process");
            const pick = (j) => JSON.stringify({ commit: j.source.commit, portfolios: j.portfolios });
            const now = JSON.parse(require("node:fs").readFileSync("src/data/portfolios.generated.json", "utf8"));
            const before = JSON.parse(execSync("git show HEAD:src/data/portfolios.generated.json", { maxBuffer: 1 << 26 }).toString());
            console.log(pick(now) === pick(before) ? "false" : "true");
          ')
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "false" ]; then
            git checkout -- src/data
            echo "No upstream changes — nothing to publish."
          else
            git diff --stat -- src/data
          fi

      - name: Run unit tests
        if: steps.diff.outputs.changed == 'true'
        run: bun test

      - name: Check Supabase secrets
        if: steps.diff.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_SECRET_KEY repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Update Supabase
        if: steps.diff.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: bun scripts/seed-db.ts --clone-dir "$RUNNER_TEMP/upstream"

      - name: Commit the refreshed artifact
        if: steps.diff.outputs.changed == 'true'
        run: |
          count=$(bun -e 'console.log(require("./src/data/portfolios.generated.json").portfolios.length)')
          commit=$(bun -e 'console.log((require("./src/data/portfolios.generated.json").source.commit || "").slice(0, 7))')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/portfolios.generated.json src/data/sync-report.generated.json
          git commit -m "chore(data): sync ${count} portfolios from upstream ${commit}"
          git push
